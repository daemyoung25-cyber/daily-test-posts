name: 매일 21시 심리테스트 게시

on:
  schedule:
    # 20:35 KST에 시작해서 스크립트가 21:00까지 기다렸다가 올린다 (GitHub 예약 실행 지연 대비)
    - cron: "35 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "올릴 날짜 (YYYY-MM-DD, 비우면 오늘)"
        required: false
      dry_run:
        description: "연습 실행 (실제로 올리지 않음)"
        type: boolean
        default: true
      platforms:
        description: "instagram,threads 중 선택"
        default: "instagram,threads"

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 게시
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TARGET_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PLATFORMS: ${{ inputs.platforms || 'instagram,threads' }}
        run: node scripts/post.mjs
      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name "daily-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "게시 기록 $(TZ=Asia/Seoul date +%F)" && git push)
