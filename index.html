<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daily_test 오늘의 게시물</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f6efe3; --card: #fffaf2; --ink: #4a4136; --sub: #8a7f70;
    --sage: #858f69; --orange: #e08a3c; --line: #e6dccb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1c18; --card: #2a2620; --ink: #efe6d8; --sub: #b3a894; --line: #3d372e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; }
  h1 small { display: block; font-size: 13px; color: var(--sub); font-weight: 400; }
  .nav button { border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; width: 40px; height: 40px; font-size: 18px; cursor: pointer; }
  .nav button:disabled { opacity: .35; }
  img { width: 100%; border-radius: 14px; display: block; }
  .row { display: flex; gap: 8px; margin: 10px 0 24px; }
  .btn { flex: 1; border: 0; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 600;
    background: var(--sage); color: #fffaf0; cursor: pointer; text-align: center; text-decoration: none; }
  .btn.alt { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  section { margin-top: 20px; }
  h2 { font-size: 15px; margin: 0 0 8px; color: var(--sage); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .box pre { white-space: pre-wrap; word-break: keep-all; margin: 0 0 10px; font: inherit; font-size: 14px; max-height: 220px; overflow: auto; }
  .box .meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--sub); }
  .box button { border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; background: var(--orange); color: #fff; cursor: pointer; }
  .box button.done { background: var(--sage); }
  .empty { text-align: center; color: var(--sub); padding: 60px 0; }
  .tip { font-size: 13px; color: var(--sub); }
</style>
</head>
<body>
<main>
  <header>
    <h1>daily_test 오늘의 게시물<small id="date"></small></h1>
    <div class="nav"><button id="prev" aria-label="이전 날">‹</button> <button id="next" aria-label="다음 날">›</button></div>
  </header>
  <div id="content"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const kstToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const days = ["일", "월", "화", "수", "목", "금", "토"];
let dates = [], idx = 0;

function label(d) {
  const w = days[new Date(d + "T00:00:00Z").getUTCDay()];
  return `${d.slice(5).replace("-", "/")} (${w})` + (d === kstToday() ? " · 오늘" : "");
}

function copyBox(title, text) {
  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = `<pre></pre><div class="meta"><span>${title} · ${[...text].length}자</span><button>복사</button></div>`;
  box.querySelector("pre").textContent = text;
  const btn = box.querySelector("button");
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
    btn.textContent = "복사됨 ✓"; btn.classList.add("done");
    setTimeout(() => { btn.textContent = "복사"; btn.classList.remove("done"); }, 1800);
  };
  return box;
}

async function show() {
  const d = dates[idx];
  $("#date").textContent = d ? label(d) : "";
  $("#prev").disabled = idx <= 0;
  $("#next").disabled = idx >= dates.length - 1;
  const c = $("#content");
  if (!d) { c.innerHTML = `<p class="empty">아직 준비된 게시물이 없어요.</p>`; return; }

  const base = `posts/${d}/`;
  const [caption, threads] = await Promise.all([
    fetch(base + "caption.txt").then(r => r.text()),
    fetch(base + "threads.json").then(r => r.json()),
  ]);
  c.innerHTML = `
    <img src="${base}image.jpg" alt="${d} 심리테스트 그림">
    <div class="row">
      <button class="btn" id="share">그림 공유 · 저장</button>
      <a class="btn alt" href="${base}image.jpg" download="daily_test_${d}.jpg">다운로드</a>
    </div>
    <p class="tip">폰에서는 "그림 공유 · 저장"으로 인스타에 바로 보내거나 사진첩에 저장할 수 있어요. 안 되면 그림을 길게 눌러 저장하세요.</p>
    <section id="ig"><h2>인스타그램 캡션</h2></section>
    <section id="th"><h2>스레드 — 본문 먼저 올리고, 결과는 답글로</h2></section>`;
  $("#ig").append(copyBox("캡션 전체", caption));
  $("#th").append(copyBox("본문 (그림과 함께)", threads.main));
  threads.replies.forEach((t, i) => $("#th").append(copyBox(`답글 ${i + 1}`, t)));

  $("#share").onclick = async () => {
    try {
      const blob = await fetch(base + "image.jpg").then(r => r.blob());
      const file = new File([blob], `daily_test_${d}.jpg`, { type: "image/jpeg" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file] });
      else window.open(base + "image.jpg", "_blank");
    } catch (e) { if (e.name !== "AbortError") window.open(base + "image.jpg", "_blank"); }
  };
}

$("#prev").onclick = () => { idx--; show(); };
$("#next").onclick = () => { idx++; show(); };

fetch("posts/index.json").then(r => r.json()).then(list => {
  dates = list.sort();
  const today = kstToday();
  const i = dates.indexOf(today);
  const upcoming = dates.findIndex(d => d > today);
  idx = i >= 0 ? i : upcoming >= 0 ? upcoming : dates.length - 1;
  show();
});
</script>
</body>
</html>
